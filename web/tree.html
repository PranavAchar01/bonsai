<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonsai Tree</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f1712; --ink:#a9e2a0; --faint:#5f7f5a; --accent:#ff7a6a; --grain:.14; --blend:overlay; --glow:none; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse at 50% 40%, rgba(255,250,238,.10), rgba(0,0,0,0) 60%),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.22) 100%),
      var(--bg);

  }

    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .title { position:fixed; left:28px; top:22px; pointer-events:none; }
  .title h1 { margin:0; font-weight:400; font-size:48px; letter-spacing:.06em; line-height:1; }
  .title div { font-size:13px; color:var(--faint); margin-top:8px; }
  .title .num { font-size:72px; color:var(--ink); margin-top:18px; line-height:1; }
  .lbl { position:fixed; font-size:12px; white-space:nowrap; pointer-events:none; transform:translate(-50%, -50%); transition:opacity .6s; opacity:0; color:var(--ink); }
  .lbl.cut { color:var(--accent); }
  .lbl.on { opacity:.85; }
  .panel { position:fixed; right:20px; top:20px; width:230px; font-size:12px; display:flex; flex-direction:column; gap:12px; }
  .panel .grp > div:first-child { color:var(--faint); margin-bottom:4px; letter-spacing:.08em; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chips button { font:inherit; font-size:12px; color:var(--ink); background:transparent; border:1px solid color-mix(in srgb, var(--ink) 30%, transparent); padding:3px 7px; cursor:pointer; }
  .chips button.on { background:var(--ink); color:var(--bg); }
  .chips button.sw { width:26px; padding:3px 0; border-width:2px; }
  .chips button.sw.on { outline:2px solid var(--ink); outline-offset:1px; }
  .title, .bar, .lbl, .panel { text-shadow:var(--glow); }
  .chips button:hover:not(.on) { background:color-mix(in srgb, var(--ink) 10%, transparent); }
  .bar { position:fixed; left:28px; bottom:22px; display:flex; gap:12px; align-items:center; font-size:13px; color:var(--faint); }
  .bar button { font:inherit; color:var(--ink); background:transparent; border:1px solid color-mix(in srgb, var(--ink) 35%, transparent); padding:5px 12px; cursor:pointer; }
  .seal { position:fixed; right:28px; bottom:22px; width:44px; height:44px; background:var(--accent); color:var(--bg); display:grid; place-items:center; font-size:26px; }
  .toggle { position:fixed; right:20px; top:20px; font:inherit; font-size:12px; color:var(--ink); background:var(--bg); border:1px solid color-mix(in srgb, var(--ink) 35%, transparent); padding:4px 10px; cursor:pointer; z-index:2; }
  .panel { top:52px; background:color-mix(in srgb, var(--bg) 82%, transparent); padding:10px; }
  .panel.closed { display:none; }
  .embed .title, .embed .toggle, .embed .panel, .embed .seal { display:none; }
  .embed .bar { left:16px; bottom:12px; }
  @media (max-width:700px) { .title h1 { font-size:30px; } .title .num { font-size:40px; } .panel { width:200px; } }
</style>

<script type="module">

const LEAF_AFTER = `
  #ifdef USE_INSTANCING_COLOR
    vColor.rgb = mix(uYoung, vColor.rgb, clamp((uTime - aBirth - .4) / uMature, 0., 1.));
  #endif`;

// ---------- foliage looks ----------
const LOOKS = {
  pine:    {bark:0x6a5d52, barkNoise:.18, needle:true, len:[.11, .17], count:[34, 52], up:1.1, light:0x7d9867, mid:0x3f5a45, dark:0x18211b, candle:0xc8d67a, wash:0x5f7d5c, drift:'needle'},
  juniper: {bark:0x7a5240, barkNoise:.22, needle:true, len:[.05, .085], count:[60, 85], up:.5, light:0x86b39a, mid:0x3e6b5c, dark:0x142520, candle:0xb7dcb0, wash:0x4f7d70, drift:'needle', shari:true},
  maple:   {bark:0x77716a, barkNoise:.06, leaf:'maple', colors:[0xb8322a, 0xd4552b, 0xe38b2c, 0x8f1f2a, 0xc9402e], young:0x9cc25a, size:[.08, .13], wash:0xb05a3a, drift:'leaf'},
  blossom: {bark:0x3e322d, barkNoise:.24, leaf:'flower', colors:[0xf7d6de, 0xf2b5c4, 0xfff3f5, 0xeaa0b4], young:0xc2386a, size:[.045, .07], wash:0xe7a3b6, drift:'petal'},
};

function shapeGeo(kind) {
  const s = new THREE.Shape(), N = 60;
  for (let i = 0; i <= N; i++) {
    const a = i / N * Math.PI * 2;
    const r = kind === 'maple' ? .45 + .55 * Math.pow(Math.abs(Math.cos(a * 2.5)), .5) * (a > 4.2 && a < 5.2 ? .4 : 1)
                               : .55 + .45 * Math.pow(Math.abs(Math.cos(a * 2.5)), .35);
    i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  const g = new THREE.ShapeGeometry(s); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i); p.setY(i, (x * x + z * z) * .18); }
  g.computeVertexNormals();
  return g;
}

// ---------- scene, lights, backdrop ----------
const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.prepend(renderer.domElement);
scene.fog = new THREE.Fog(0xefe7d6, 11, 34);
const cam = new THREE.PerspectiveCamera(30, 1, .1, 200);
const controls = new OrbitControls(cam, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = .35;
controls.minDistance = 5; controls.maxDistance = 22; controls.maxPolarAngle = Math.PI * .58; controls.enablePan = false;
const hemi = new THREE.HemisphereLight(0xfff8ec, 0x6f6455, 2.2); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e0, 1.3);
sun.position.set(-6, 10, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 14; sun.shadow.blurSamples = 20; sun.shadow.bias = -.0005;
Object.assign(sun.shadow.camera, {left:-7, right:7, top:9, bottom:-5, near:1, far:30}); scene.add(sun);
const rim = new THREE.DirectionalLight(0xffffff, 0); rim.position.set(4, 5, -9); scene.add(rim);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({color:0x3a2e20, opacity:.09}));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

function washTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  for (let i = 0; i < 40; i++) {
    const px = 128 + rr(-50, 50), py = 128 + rr(-30, 30), r = rr(30, 90), g = x.createRadialGradient(px, py, r * .2, px, py, r);
    g.addColorStop(0, 'rgba(255,255,255,.05)'); g.addColorStop(.8, 'rgba(255,255,255,.09)'); g.addColorStop(1, 'rgba(255,255,255,0)');

const WASH = washTexture();
const hills = [];
for (let i = 0; i < 9; i++) {
  const a = i / 9 * Math.PI * 2, s = new THREE.Sprite(new THREE.SpriteMaterial({map:WASH, transparent:true, opacity:.55, depthWrite:false}));
  s.position.set(Math.cos(a) * 20, rr(.5, 1.6), Math.sin(a) * 20); s.scale.set(rr(12, 18), rr(4, 6), 1); scene.add(s); hills.push(s);
}
const sunS = new THREE.Sprite(new THREE.SpriteMaterial({map:WASH, transparent:true, opacity:.5, depthWrite:false, fog:false}));
sunS.position.set(9, 9, -16); sunS.scale.set(5, 5, 1); scene.add(sunS);

// ---------- build ----------
let G = null, END = 0, labels = [], pads = [], cuts = [], padObjs = [], cutObjs = [], driftSys = null, kept = [], FLOOR = -.73;
const SEG = 1.7;
const ink = c => new THREE.MeshLambertMaterial({color:c});

function build() {
  if (G) { G.traverse(o => { o.geometry?.dispose(); (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m?.dispose()); }); scene.remove(G); }
  document.getElementById('labels').innerHTML = '';

  seed = 11; labels = []; pads = []; cuts = [];
  const look = LOOKS[S.foliage];
  const W = { pos:[], nor:[], cen:[], bir:[], dea:[], piv:[], axi:[], col:[], idx:[] };
  const N = { pos:[], base:[], bir:[], dea:[], piv:[], axi:[], col:[] };
  const L = [];
  const barkC = lin(look.bark), boneC = lin(0xd9d2c3);
  let fall = null;                 // {death, pivot, axis} while building parts of a pruned branch
  const fA = () => fall ? [fall.death, ...fall.pivot.toArray(), ...fall.axis.toArray()] : [-1, 0, 0, 0, 1, 0, 0];

        N.piv.push(px, py, pz); N.axi.push(ax, ay, az); N.col.push(c.r, c.g, c.b, a);

  function leafCluster(P, birth, count) {
    for (let j = 0; j < count; j++) {
      const p = P.clone().add(randDir().multiplyScalar(rr(.02, .1))); p.y += rr(0, .05);
      L.push({p, q:new THREE.Quaternion().setFromEuler(new THREE.Euler(rr(-.6, .6), rr(0, 6.28), rr(-.6, .6))), s:rr(...look.size), birth:birth + rr(0, .8), f:fall, c:look.colors[Math.floor(rnd() * look.colors.length)]});
    }
  }
  function foliageAt(P, birth, density) {
    if (look.needle) tuft(P, birth, rr(...look.len), Math.round(rr(...look.count) * density));
    else leafCluster(P, birth, Math.round((look.leaf === 'flower' ? 3 : 4) * density + rnd() * 2));
  }
  function pad(at, dir, size, birth, density = 1) {
    const flat = V(dir.x, 0, dir.z).normalize(), twigs = Math.round(9 + size * 8);
    const center = at.clone().addScaledVector(flat, size * .35).add(V(0, size * .12, 0));
    const forks = look.leaf ? 3 : 2;
    for (let i = 0; i < twigs; i++) {
      const td = flat.clone().applyAxisAngle(UP, rr(-1.5, 1.5)).add(V(0, rr(-.05, .25), 0));
      const len = size * rr(.45, 1.0), tb = birth + rr(0, .5);
      const pts = walk(at, td, len, {gnarl:.35, step:.04, pull:UP, pullK:.03});
      addTube(pts, taper(pts.length, .035, .006), ramp(pts.length, tb, tb + .5), {radial:5, bark:.05, seed:i, cutAt:0, light:.1});
      for (let k = Math.floor(pts.length * .25); k < pts.length; k += 2) {
        const p = pts[k].clone(), dc = p.distanceTo(center) / size; p.y += size * .18 * Math.max(0, 1 - dc * dc);
        foliageAt(p, tb + .3 + k / pts.length * .5, density);
      }
      for (let f = 0; f < forks; f++) {
        const m = Math.floor(pts.length * rr(.35, .75)), fd = td.clone().applyAxisAngle(UP, (f % 2 ? 1 : -1) * rr(.5, .9));
        const fp = walk(pts[m], fd, len * rr(.3, .5), {gnarl:.4, step:.04, pull:UP, pullK:.04}), fb = tb + .25;
        addTube(fp, taper(fp.length, .014, .004), ramp(fp.length, fb, fb + .3), {radial:4, bark:0, seed:f, cutAt:0, light:.1});
        for (let k = 1; k < fp.length; k += 2) foliageAt(fp[k].clone().add(V(0, size * .08, 0)), fb + .4, density * .75);
      }
    }
    pads.push({center, size, birth, fall});
  }

  // --- form: trunk path, thickness, where branches go ---
  const F = {
    moyogi:   {path:t => V(Math.sin(t * 4 + .3) * .85 - t * .35, -.12 + t * 4.3, Math.cos(t * 3) * .4 - .4), r:t => .07 + .22 * Math.pow(1 - t, 1.3), range:[.2, .88], pot:'rect', target:[0, 1.9, 0], dist:15.5},
    cascade:  {path:t => V(Math.pow(t, 1.4) * 2.3 + Math.sin(t * 6) * .12, -.12 + 1.6 * Math.sin(Math.min(t, .62) / .62 * Math.PI / 2) - (t > .62 ? Math.pow((t - .62) / .38, 1.6) * 3.0 : 0), Math.sin(t * 3) * .35),
               r:t => .08 + .2 * Math.pow(1 - t, 1.2), range:[.25, .95], pot:'tall', target:[.9, .1, 0], dist:15},
    literati: {path:t => V(Math.sin(t * 2.6) * .6 + t * .5, -.12 + t * 5.8, Math.sin(t * 3.3) * .3), r:t => .05 + .12 * Math.pow(1 - t, 1.2), range:[.62, .96], pot:'round', target:[.3, 2.7, 0], dist:17.5, padK:.7},
    windswept:{path:t => V(t * 2.4 + Math.sin(t * 3) * .25, -.12 + t * 3.7 - t * t * .7, Math.sin(t * 2) * .2), r:t => .06 + .2 * Math.pow(1 - t, 1.3), range:[.22, .9], pot:'rect', target:[1.4, 1.5, 0], dist:18, bias:V(1, 0, 0)},
  }[S.form];
  const padK = F.padK || 1;
  const vs = {}; VERSIONS.forEach(v => (vs[v.parent] ??= []).push(v));
  kept = []; for (let v = VERSIONS.find(v => !v.parent); v; v = (vs[v.id] || []).find(c => c.kept)) kept.push(v);
  const TRUNK_T = kept.length * SEG, TN = 160;
  const trunkPts = []; for (let i = 0; i < TN; i++) { const t = i / (TN - 1); trunkPts.push(F.path(t).add(V(fbm(t * 3, 1, 0) * .12, 0, fbm(t * 3, 5, 0) * .12))); }
  const trunkB = t => t * TRUNK_T;
  addTube(trunkPts, trunkPts.map((_, i) => F.r(i / (TN - 1))), trunkPts.map((_, i) => trunkB(i / (TN - 1))), {radial:32, bark:look.barkNoise, flare:true, seed:3, shari:look.shari, shariEnd:3.2});
  const trunkAt = t => trunkPts[Math.round(t * (TN - 1))];
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2 + rr(-.3, .3), pts = walk(trunkPts[0].clone().setY(.02), V(Math.cos(a), -.35, Math.sin(a)), rr(.5, .95), {gnarl:.2, pull:V(0, -1, 0), pullK:.05, floor:-.13});
    addTube(pts, taper(pts.length, .14, .02, .6), ramp(pts.length, 0, .9), {radial:10, bark:.1, seed:i + 9});
  }
  kept.forEach((v, i) => {
    (vs[v.id] || []).forEach((c, k) => {
      const [a0, a1] = F.range, tA = Math.min(.97, a0 + (a1 - a0) * i / Math.max(1, kept.length - 1) + k * .05);
      const start = trunkAt(tA).clone(), ang = i * 2.35 + k * 2.6 + .4;
      const out = V(Math.cos(ang), 0, Math.sin(ang));
      if (F.bias) out.lerp(F.bias, .7).normalize();
      const b0 = trunkB(tA) + .2, len = (c.kept ? 1.1 + c.score * 1.5 : .95) * padK;
      const pts = walk(start, out.clone().add(V(0, .25, 0)), len, {gnarl:.22, pull:V(0, -1, 0).addScaledVector(out, .5), pullK:.035});
      const b1 = b0 + len * .9, cutI = Math.floor(pts.length * .3);
      if (!c.kept) {
        const pivot = pts[cutI].clone(), axis = UP.clone().cross(out).normalize();
        fall = {death:b1 + 1.8, pivot, axis};
        cuts.push({at:pivot, dir:pts[cutI + 1].clone().sub(pivot).normalize(), r:F.r(tA) * .5, t:fall.death});
        labels.push({text:`${c.id}  ${c.signal}`, cls:'cut', at:pivot.clone().addScaledVector(out, .35).add(V(0, .3, 0)), t:fall.death + .2});
      }
      addTube(pts, taper(pts.length, F.r(tA) * .55, .035, .7), ramp(pts.length, b0, b1), {radial:14, bark:.1, seed:i * 3 + k, cutAt:c.kept ? null : cutI});
      pad(pts.at(-1), out, (c.kept ? .65 + c.score * .9 : .5) * padK, b1 - .2, c.kept ? 1 : .7);
      if (c.kept) {
        const m = pts[Math.floor(pts.length * .55)], sd = out.clone().applyAxisAngle(UP, k % 2 ? .9 : -.9);
        const sp = walk(m, sd.add(V(0, .2, 0)), len * .45, {gnarl:.3, pull:V(0, -1, 0), pullK:.03}), sb = b0 + len * .5;
        addTube(sp, taper(sp.length, F.r(tA) * .25, .02), ramp(sp.length, sb, sb + .6), {radial:8, bark:.08, seed:i + k + 20});
        pad(sp.at(-1), sd, .45 * padK, sb + .4, .9);
        labels.push({text:`${c.id}  ${Math.round(c.score * 100)}%`, at:pts.at(-1).clone().add(V(0, -.4, 0)), t:b1 + .8});
      }
      fall = null;
    });
  });
  const top = trunkPts.at(-1);
  for (let i = 0; i < 4; i++) {
    const d = V(Math.cos(i * 1.7), S.form === 'cascade' ? -.2 : .5, Math.sin(i * 1.7)), pts = walk(top, d, rr(.4, .7), {gnarl:.3, pull:UP, pullK:.02});
    addTube(pts, taper(pts.length, .09, .02), ramp(pts.length, TRUNK_T - .3, TRUNK_T + .4), {radial:8, seed:40 + i});
    pad(pts.at(-1), d, .55 * padK, TRUNK_T);
  }
  labels.push({text:`${kept.at(-1).id}  best`, at:top.clone().add(V(0, 1.0, 0)), t:TRUNK_T + 1.2});
  END = Math.max(TRUNK_T + 2.5, ...cuts.map(c => c.t + 2.6));

  // --- meshes ---
  const f32 = (a, k) => new THREE.Float32BufferAttribute(a, k);
  const wg = new THREE.BufferGeometry();
  wg.setAttribute('position', f32(W.pos, 3)); wg.setAttribute('normal', f32(W.nor, 3)); wg.setAttribute('color', f32(W.col, 3));
  wg.setAttribute('aCenter', f32(W.cen, 3)); wg.setAttribute('aBirth', f32(W.bir, 1)); wg.setAttribute('aDeath', f32(W.dea, 1));
  wg.setAttribute('aPivot', f32(W.piv, 3)); wg.setAttribute('aAxis', f32(W.axi, 3)); wg.setIndex(W.idx);
  const wood = new THREE.Mesh(wg, patch(new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.DoubleSide}), WOOD_BEGIN, '', 'attribute vec3 aCenter;'));
  wood.castShadow = true; wood.frustumCulled = false;
  wood.customDepthMaterial = patch(new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking}), WOOD_BEGIN, '', 'attribute vec3 aCenter;');
  G.add(wood);

  if (N.pos.length) {
    const ng = new THREE.BufferGeometry();
    ng.setAttribute('position', f32(N.pos, 3)); ng.setAttribute('aBase', f32(N.base, 3)); ng.setAttribute('aBirth', f32(N.bir, 1));
    ng.setAttribute('aDeath', f32(N.dea, 1)); ng.setAttribute('aPivot', f32(N.piv, 3)); ng.setAttribute('aAxis', f32(N.axi, 3)); ng.setAttribute('color', f32(N.col, 4));
    const ln = new THREE.LineSegments(ng, patch(new THREE.LineBasicMaterial({vertexColors:true, transparent:true, depthWrite:false}), NEEDLE_BEGIN, NEEDLE_AFTER, 'attribute vec3 aBase;'));
    ln.frustumCulled = false; G.add(ln);
    U.uCandle.value = lin(look.candle);
  }
  if (L.length) {
    const geo = shapeGeo(look.leaf), n = L.length;
    const att = (k, fn) => { const arr = new Float32Array(n * k); L.forEach((l, i) => { const v = fn(l); typeof v === 'number' ? arr[i] = v : arr.set(v, i * k); }); return new THREE.InstancedBufferAttribute(arr, k); };
    geo.setAttribute('aBirth', att(1, l => l.birth)); geo.setAttribute('aDeath', att(1, l => l.f ? l.f.death : -1));
    geo.setAttribute('aPivot', att(3, l => l.f ? l.f.pivot.toArray() : [0, 0, 0])); geo.setAttribute('aAxis', att(3, l => l.f ? l.f.axis.toArray() : [1, 0, 0]));
    const im = new THREE.InstancedMesh(geo, patch(new THREE.MeshLambertMaterial({side:THREE.DoubleSide}), LEAF_BEGIN, LEAF_AFTER), n);
    const M = new THREE.Matrix4(), c = new THREE.Color();
    L.forEach((l, i) => { M.compose(l.p, l.q, V(l.s, l.s, l.s)); im.setMatrixAt(i, M); im.setColorAt(i, c.setHex(l.c)); });
    im.castShadow = true; im.frustumCulled = false;
    im.customDepthMaterial = patch(new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking}), LEAF_BEGIN);
    G.add(im);
    U.uYoung.value = lin(look.young); U.uMature.value = look.leaf === 'maple' ? 6 : 1.2;
  }

  const proxyMat = new THREE.MeshBasicMaterial({colorWrite:false, depthWrite:false});
  padObjs = pads.map(p => {
    const sprites = [0, 1, 2].map(j => {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({map:WASH, color:j === 2 ? 0x2f4a3e : look.wash, transparent:true, opacity:0, depthWrite:false}));
      s.position.copy(p.center).add(V(rr(-.2, .2), j === 2 ? -.12 : rr(0, .15), rr(-.2, .2)));
      s.userData.k = p.size * (j === 2 ? 1.7 : 2.1) * rr(.85, 1.1); s.renderOrder = -1; G.add(s); return s;
    });
    const proxy = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 10), proxyMat); proxy.position.copy(p.center); proxy.castShadow = true; G.add(proxy);
    return {p, sprites, proxy, base:p.center.clone()};
  });

    const m = new THREE.Mesh(new THREE.CylinderGeometry(c.r, c.r * 1.05, .03, 20), new THREE.MeshBasicMaterial({color:new THREE.Color(PALETTES[S.palette].accent)}));
    m.position.copy(c.at); m.quaternion.setFromUnitVectors(UP, c.dir); G.add(m); return {c, m};
  });

  buildPot(F.pot);
  driftSys = makeDrift(look);
  labels.forEach(l => { const d = document.createElement('div'); d.className = 'lbl ' + (l.cls || ''); d.textContent = l.text; document.getElementById('labels').appendChild(d); l.el = d; });
  controls.target.set(...F.target); cam.position.set(F.target[0] + 2, F.target[1] + 1.8, F.dist);
  t = 0;
}

// ---------- pot ----------
function buildPot(kind) {
  const add = m => { m.castShadow = true; G.add(m); return m; };
  let footprint;
  if (kind === 'round') {
    const g = new THREE.CylinderGeometry(1.25, 1.05, .32, 64, 1); g.translate(0, -.26, 0);
    add(new THREE.Mesh(g, ink(0x5a3a2c)));
    for (let i = 0; i < 3; i++) { const f = add(new THREE.Mesh(new THREE.CylinderGeometry(.12, .1, .1, 12), ink(0x40291f))); f.position.set(Math.cos(i * 2.09) * .85, -.46, Math.sin(i * 2.09) * .85); }
    FLOOR = -.51; footprint = (x, z) => Math.hypot(x, z) < 1.15;
  } else {
    const tall = kind === 'tall', w = tall ? 1.05 : 1.75, d = tall ? 1.05 : 1.15, r = .2, depth = tall ? 1.7 : .5;
    const shape = new THREE.Shape();
    shape.moveTo(-w + r, -d); shape.lineTo(w - r, -d); shape.quadraticCurveTo(w, -d, w, -d + r); shape.lineTo(w, d - r); shape.quadraticCurveTo(w, d, w - r, d);
    shape.lineTo(-w + r, d); shape.quadraticCurveTo(-w, d, -w, d - r); shape.lineTo(-w, -d + r); shape.quadraticCurveTo(-w, -d, -w + r, -d);
    const g = new THREE.ExtrudeGeometry(shape, {depth, bevelEnabled:true, bevelThickness:.04, bevelSize:.04, bevelSegments:3, curveSegments:8});
    g.rotateX(-Math.PI / 2); g.translate(0, -.12 - depth, 0);
    const pa = g.attributes.position, k0 = tall ? .9 : .86;
    for (let i = 0; i < pa.count; i++) { const y = pa.getY(i), k = k0 + (1 - k0) * Math.min(1, Math.max(0, (y + .12 + depth) / depth)); pa.setX(i, pa.getX(i) * k); pa.setZ(i, pa.getZ(i) * k); }
    g.computeVertexNormals();
    add(new THREE.Mesh(g, ink(tall ? 0x2f3a44 : 0x37302b)));
    const fx = w * .72, fz = d * .65;
    for (const [x, z] of [[-fx, -fz], [fx, -fz], [-fx, fz], [fx, fz]]) { const f = add(new THREE.Mesh(new THREE.BoxGeometry(.3, .14, .22), ink(0x2a2420))); f.position.set(x, -.2 - depth, z); }
    FLOOR = -.27 - depth; footprint = (x, z) => Math.abs(x) < w - .12 && Math.abs(z) < d - .12;
  }
  const soil = new THREE.Mesh(kind === 'round' ? new THREE.CircleGeometry(1.2, 48) : kind === 'tall' ? new THREE.PlaneGeometry(1.95, 1.95) : new THREE.PlaneGeometry(3.3, 2.1), ink(0x2e2720));
  soil.rotation.x = -Math.PI / 2; soil.position.y = -.1; G.add(soil);
  const mp = [], mc = [], green = [lin(0x56704a), lin(0x3c5236), lin(0x7d915e)];
  for (let i = 0; i < 9000; i++) {
    const x = rr(-1.7, 1.7), z = rr(-1.1, 1.1);
    if (!footprint(x, z) || fbm(x * 1.4, z * 1.4, 4) < -.25) continue;
    const h = Math.max(0, .14 - Math.hypot(x, z * 1.4) * .08) + fbm(x * 3, z * 3, 0) * .03;
    mp.push(x, -.09 + h, z); const c = green[i % 3]; mc.push(c.r, c.g, c.b);
  }
  const mg = new THREE.BufferGeometry(); mg.setAttribute('position', new THREE.Float32BufferAttribute(mp, 3)); mg.setAttribute('color', new THREE.Float32BufferAttribute(mc, 3));
  G.add(new THREE.Points(mg, new THREE.PointsMaterial({size:.035, vertexColors:true})));
  for (const [x, z, s] of [[.75, .35, .2], [.95, .1, .12], [-.8, -.4, .16]]) if (footprint(x, z)) {
    const st = add(new THREE.Mesh(new THREE.DodecahedronGeometry(s, 1), ink(0x6d6760))); st.position.set(x, -.08, z); st.scale.y = .6; st.rotation.set(rnd(), rnd(), rnd());
  }
  floor.position.y = FLOOR; U.uGround.value = FLOOR;
}

// ---------- idle drift: a needle, leaf or petal lets go now and then ----------
function makeDrift(look) {
  const geo = look.drift === 'needle' ? new THREE.BoxGeometry(.005, .005, .14) : shapeGeo(look.leaf).scale(look.size[1], look.size[1], look.size[1]);
  const n = 70, im = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({color:look.drift === 'needle' ? 0x8a7a4a : look.colors[0], side:THREE.DoubleSide}), n);
  im.frustumCulled = false; G.add(im);
  const P = Array.from({length:n}, () => ({on:false})), M = new THREE.Matrix4(), Z = new THREE.Matrix4().makeScale(0, 0, 0), Q = new THREE.Quaternion();
  for (let i = 0; i < n; i++) im.setMatrixAt(i, Z);
  const slow = look.drift !== 'needle';
  return {
    step(dt, t) {
      if (t > END - 1 && rnd() < dt * (slow ? 2.2 : 1.6)) {
        const live = padObjs.filter(o => !o.p.fall), o = live[Math.floor(rnd() * live.length)], p = P.find(p => !p.on);
        if (o && p) Object.assign(p, {on:true, pos:o.base.clone().add(V(rr(-1, 1) * o.p.size * .7, rr(-.1, .1), rr(-1, 1) * o.p.size * .7)), vy:0, ph:rnd() * 6, rot:new THREE.Euler(rnd() * 6, rnd() * 6, rnd() * 6), life:0, landed:-1});
      }
      P.forEach((p, i) => {
        if (!p.on) return;
        p.life += dt;
        if (p.landed < 0) {
          p.vy = Math.max(p.vy - dt * (slow ? .9 : 2.5), slow ? -.45 : -1.1);
          p.pos.y += p.vy * dt;
          p.pos.x += (Math.sin(p.life * (slow ? 2.4 : 4) + p.ph) * (slow ? .55 : .2) + U.uWind.value * .25) * dt;
          p.pos.z += Math.cos(p.life * 1.9 + p.ph) * (slow ? .35 : .1) * dt;
          p.rot.x += dt * (slow ? 2.5 : 4); p.rot.z += dt * 1.7;
          const ground = Math.abs(p.pos.x) < 1.6 && Math.abs(p.pos.z) < 1 && p.pos.y > -.15 ? -.08 : FLOOR + .01;
          if (p.pos.y <= ground) { p.pos.y = ground; p.landed = p.life; p.rot.x = slow ? 0 : Math.PI / 2; }
        }
        const s = p.landed > 0 ? Math.max(0, 1 - (p.life - p.landed - 3) / 1.5) : 1;
        if (s <= 0) { p.on = false; im.setMatrixAt(i, Z); return; }
        M.compose(p.pos, Q.setFromEuler(p.rot), V(s, s, s)); im.setMatrixAt(i, M);
      });
      im.instanceMatrix.needsUpdate = true;
    }
  };
}

function applyPalette() {
  const P = PALETTES[S.palette], r = document.documentElement.style;
  P.dark = isDark(P.bg);
  P.hills = new THREE.Color(P.bg).lerp(new THREE.Color(P.ink), P.dark ? .14 : .35).getHex(); P.sun = new THREE.Color(P.accent).getHex();
  r.setProperty('--bg', P.bg); r.setProperty('--ink', P.ink); r.setProperty('--faint', P.faint); r.setProperty('--accent', P.accent);
  r.setProperty('--glow', P.glow ? `0 0 6px ${P.ink}88, 0 0 18px ${P.ink}33` : 'none');
  r.setProperty('--grain', P.dark ? .14 : .28); r.setProperty('--blend', P.dark ? 'overlay' : 'multiply');
  scene.fog.color.set(P.bg);
  hills.forEach(h => h.material.color.setHex(P.hills)); sunS.material.color.setHex(P.sun);
  hemi.intensity = P.dark ? 1.0 : 2.2; sun.intensity = P.dark ? .9 : 1.3;
  rim.color.set(P.ink); rim.intensity = P.dark ? 1.6 : 0;
  floor.material.color.set(P.dark ? 0x000000 : 0x3a2e20); floor.material.opacity = P.dark ? .35 : .09;
  cutObjs.forEach(o => o.m.material.color.set(P.accent));
}

// ---------- panel ----------
const WIND = {still:0, breeze:1, gale:2.6};
const GROUPS = [
  ['form', ['moyogi', 'cascade', 'literati', 'windswept']],
  ['foliage', ['pine', 'juniper', 'maple', 'blossom']],
  ['palette', Object.keys(PALETTES)],
  ['wind', Object.keys(WIND)],
  ['speed', [1, 2, 4]],
];
function panel() {
  document.getElementById('panel').innerHTML = GROUPS.map(([k, opts]) => `<div class="grp"><div>${k}${k === 'palette' ? ' · ' + PALETTES[S.palette].name : ''}</div><div class="chips">${
    opts.map(o => k === 'palette'
      ? `<button data-k="${k}" data-v="${o}" title="${PALETTES[o].name}" class="sw ${S[k] === o ? 'on' : ''}" style="background:${PALETTES[o].bg};color:${PALETTES[o].ink};border-color:${PALETTES[o].accent}">■</button>`
      : `<button data-k="${k}" data-v="${o}" class="${String(S[k]) === String(o) ? 'on' : ''}">${k === 'speed' ? o + 'x' : o}</button>`).join('')}</div></div>`).join('');
}
document.getElementById('panel').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const k = b.dataset.k; S[k] = k === 'speed' ? +b.dataset.v : b.dataset.v; panel();
  if (k === 'form' || k === 'foliage') { build(); applyPalette(); }
  if (k === 'palette') applyPalette();
  history.replaceState(null, '', '?' + new URLSearchParams({form:S.form, foliage:S.foliage, p:S.palette, wind:S.wind, speed:S.speed}));
};

// ---------- run ----------
let t = 0, last = performance.now();
document.getElementById('replay').onclick = () => { t = 0; };
const clock = document.getElementById('clock'), num = document.getElementById('num'), from = document.getElementById('from');
const sm = x => { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); };
function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
panel(); build(); applyPalette();
const pn = document.getElementById('panel');
if (innerWidth < 1100 && !q.get('open')) pn.classList.add('closed');
document.getElementById('toggle').onclick = () => pn.classList.toggle('closed');
U.uWind.value = WIND[S.wind];
t = +(q.get('t') || 0);   // jump to a moment, handy for screenshots

// Inside the main page (?embed=1) the tree is the whole frame and the page around it carries the words.
if (q.get('embed')) document.body.classList.add('embed');
// Live lineage: redraw when the loop stores a new version, and replay only the newest growth.
let seen = '';
async function live() {
  try {
    const r = await fetch('lineage.json', {cache:'no-store'});
    if (r.ok) {
      const vs = (await r.json()).versions || [], key = vs.map(v => v.id + v.kept).join();
      if (vs.length && key !== seen) {
        const first = !seen; seen = key; VERSIONS = vs; build(); applyPalette();
        t = first ? 0 : Math.max(0, (kept.length - 1) * SEG - .4);
      }
    }
  } catch {}
  setTimeout(live, 3000);
}
live();

const tmp = V();
renderer.setAnimationLoop(now => {
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now;
  t += dt * S.speed; U.uTime.value = t;
  U.uWind.value += (WIND[S.wind] - U.uWind.value) * Math.min(1, dt * 1.5);
  const gen = Math.max(0, Math.min(kept.length - 1, Math.floor(t / SEG)));
  clock.textContent = `generation ${gen + 1} of ${kept.length}`;
  num.textContent = Math.round(kept[gen].score * 100) + '%'; from.textContent = `from ${Math.round(kept[0].score * 100)}%  held-out`;
  const gust = .55 + .45 * Math.sin(t * .31) * Math.sin(t * .17 + 1.3);
  for (const {p, sprites, proxy, base} of padObjs) {
    let g = sm((t - p.birth - .4) / 1.6);
    if (p.fall) g *= 1 - sm((t - p.fall.death) / .5);
    const h = Math.max(base.y + .1, 0), k = U.uWind.value * gust * (.0035 * h * h + .012 * (base.x ** 2 + base.z ** 2));
    const off = V(Math.sin(t * 1.25 + base.y * .5 + base.z * .3) * k + U.uWind.value * .004 * h * h, 0, Math.cos(t * .93 + base.x * .4) * k * .6);
    sprites.forEach(s => { s.material.opacity = g * (PALETTES[S.palette].dark ? .3 : .6); s.scale.set(s.userData.k * (.6 + .4 * g), s.userData.k * .55 * (.6 + .4 * g), 1); });
    proxy.position.copy(base).add(off);
    proxy.scale.set(p.size * 1.05 * g + 1e-4, p.size * .38 * g + 1e-4, p.size * .9 * g + 1e-4);
  }
  for (const {c, m} of cutObjs) { const g = sm((t - c.t) / .25); m.scale.setScalar(g < .01 ? 1e-4 : g); }
  driftSys.step(dt * S.speed, t);
  controls.update();
  renderer.render(scene, cam);
  for (const l of labels) {
    tmp.copy(l.at).project(cam);
    l.el.style.left = (tmp.x * .5 + .5) * innerWidth + 'px'; l.el.style.top = (-tmp.y * .5 + .5) * innerHeight + 'px';
    l.el.classList.toggle('on', t > l.t && tmp.z < 1);
  }
});
</script>
</body>
</html>
