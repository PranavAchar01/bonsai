<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonsai Tree</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --bg:#efe7d6; --ink:#1d1b19; --faint:#8b8272; --accent:#b5332a; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse at 50% 38%, rgba(255,252,244,.5), rgba(0,0,0,0) 60%),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 58%, rgba(60,48,30,.16) 100%),
      var(--bg);
    color:var(--ink); font-family:"DotGothic16", monospace; transition:background-color 6s, color 6s;
  }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; opacity:.26; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hud { position:fixed; left:28px; top:22px; pointer-events:none; }
  .hud h1 { margin:0; font-weight:400; font-size:44px; letter-spacing:.06em; line-height:1; }
  .hud .sub { font-size:13px; color:var(--faint); margin-top:8px; }
  .hud .num { font-size:76px; line-height:1; margin-top:20px; }
  .hud .meta { font-size:13px; color:var(--faint); margin-top:4px; }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; margin-left:8px; border:1px solid currentColor; vertical-align:middle; letter-spacing:.1em; }
  .tag.live { color:var(--accent); }
  .ticker { position:fixed; right:28px; top:24px; width:280px; font-size:12px; text-align:right; pointer-events:none; }
  .ticker div { padding:3px 0; opacity:.85; }
  .ticker .cut { color:var(--accent); text-decoration:line-through; text-decoration-color:color-mix(in srgb, var(--accent) 50%, transparent); }
  .phase { position:fixed; left:28px; bottom:22px; right:100px; font-size:13px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lbl { position:fixed; font-size:12px; white-space:nowrap; pointer-events:none; transform:translate(-50%, -50%); color:var(--ink); }
  .lbl.cut { color:var(--accent); }
  .seal { position:fixed; right:28px; bottom:22px; width:44px; height:44px; background:var(--accent); color:var(--bg); display:grid; place-items:center; font-size:26px; transition:background-color 6s; }
  .embed .hud, .embed .ticker, .embed .seal { display:none; }
  .embed .phase { left:16px; bottom:12px; }
  @media (max-width:700px) { .hud h1 { font-size:28px; } .hud .num { font-size:44px; } .ticker { display:none; } }
</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }</script>
</head>
<body>
<div class="hud">
  <h1>盆栽 BONSAI<span class="tag" id="mode"></span></h1>
  <div class="sub">a harness that prunes itself</div>
  <div class="num" id="num">--</div>
  <div class="meta" id="from"></div>
  <div class="meta" id="counts"></div>
</div>
<div class="ticker" id="ticker"></div>
<div id="labels"></div>
<div class="phase" id="phase"></div>
<div class="seal">盆</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PALETTES } from './palettes.js';
import { createBonsai } from './bonsai3d.js';
import { startFeed } from './feed.js';

const q = new URLSearchParams(location.search);
// Inside the main page (?embed=1) the tree is the whole frame and the page around it carries the words.
if (q.get('embed')) document.body.classList.add('embed');

// The main look alternates: each new tree takes the next form and foliage, and the paper slowly changes between the two light palettes.
const COMBOS = [['moyogi', 'pine'], ['windswept', 'blossom'], ['moyogi', 'blossom'], ['windswept', 'pine']];
let comboN = 0; try { comboN = +(localStorage.getItem('bonsai-combo') || 0); localStorage.setItem('bonsai-combo', comboN + 1); } catch {}
const form = q.get('form') || COMBOS[comboN % 4][0], foliage = q.get('foliage') || COMBOS[comboN % 4][1];
const LIGHT = [PALETTES.paper, PALETTES.matcha];

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setClearColor(0, 0);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xefe7d6, 14, 40);
const cam = new THREE.PerspectiveCamera(30, 1, .1, 400);
cam.position.set(2, 3.4, 15);
const controls = new OrbitControls(cam, renderer.domElement);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = .3; controls.enablePan = false;
controls.maxPolarAngle = Math.PI * .56; controls.minDistance = 4; controls.maxDistance = 120;
controls.target.set(0, 1.6, 0);
const hemi = new THREE.HemisphereLight(0xfff8ec, 0x6f6455, 1.6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.1);
sun.position.set(-6, 11, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 14; sun.shadow.blurSamples = 20; sun.shadow.bias = -.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfe8ff, .5); fill.position.set(6, 3, -6); scene.add(fill);

// distant ink hills and a pale sun, as soft washes
function washTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  for (let i = 0; i < 40; i++) {
    const px = 128 + (Math.random() - .5) * 100, py = 128 + (Math.random() - .5) * 60, r = 30 + Math.random() * 60, g = x.createRadialGradient(px, py, r * .2, px, py, r);
    g.addColorStop(0, 'rgba(255,255,255,.05)'); g.addColorStop(.8, 'rgba(255,255,255,.09)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const WASH = washTexture(), hills = [], HILL = new THREE.Color(0x5c6a7c);
for (let i = 0; i < 10; i++) {
  const a = i / 10 * Math.PI * 2, s = new THREE.Sprite(new THREE.SpriteMaterial({map:WASH, transparent:true, opacity:.5, depthWrite:false}));
  s.position.set(Math.cos(a) * 30, 1 + Math.random(), Math.sin(a) * 30); s.scale.set(18 + Math.random() * 10, 6 + Math.random() * 3, 1); scene.add(s); hills.push(s);
}
const sunS = new THREE.Sprite(new THREE.SpriteMaterial({map:WASH, transparent:true, opacity:.45, depthWrite:false, fog:false}));
sunS.position.set(12, 12, -26); sunS.scale.set(7, 7, 1); scene.add(sunS);

// ---------- palette crossfade ----------
function setPalette(P) {
  const r = document.documentElement.style;
  r.setProperty('--bg', P.bg); r.setProperty('--ink', P.ink); r.setProperty('--faint', P.faint); r.setProperty('--accent', P.accent);
}
let palIdx = comboN % 2; setPalette(LIGHT[palIdx]);
const fogFrom = new THREE.Color(LIGHT[palIdx].bg), fogTo = fogFrom.clone(); let palT = 1;
setInterval(() => { palIdx = 1 - palIdx; setPalette(LIGHT[palIdx]); fogFrom.copy(scene.fog.color); fogTo.set(LIGHT[palIdx].bg); palT = 0; }, 45000);

// ---------- tree + labels ----------
const labelsEl = document.getElementById('labels'), labels = [];
function onLabel({text, pos, cut}) {
  const el = document.createElement('div'); el.className = 'lbl' + (cut ? ' cut' : ''); el.textContent = text; labelsEl.appendChild(el);
  labels.push({el, pos:pos.clone(), born:performance.now()});
}
let tree = createBonsai({scene, form, foliage, accent:LIGHT[0].accent, onLabel});

// ---------- HUD ----------
const $ = id => document.getElementById(id);
const stats = {first:null, best:null, kept:0, pruned:0, ticker:[]};
function hud() {
  $('num').textContent = stats.best == null ? '--' : Math.round(stats.best * 100) + '%';
  $('from').textContent = stats.first == null ? '' : `from ${Math.round(stats.first * 100)}%  held-out`;
  $('counts').textContent = stats.first == null ? '' : `${stats.kept} kept  ${stats.pruned} pruned`;
  $('ticker').innerHTML = stats.ticker.slice(-6).map(x => `<div class="${x.cut ? 'cut' : ''}">${x.text}</div>`).join('');
}

startFeed(e => {
  if (e.type === 'mode') { $('mode').textContent = {demo:'DEMO', live:'LIVE', record:'RECORD'}[e.mode]; $('mode').className = 'tag ' + e.mode; }
  else if (e.type === 'phase') $('phase').textContent = e.text;
  else if (e.type === 'reset') {
    tree.dispose(); labels.forEach(l => l.el.remove()); labels.length = 0;
    tree = createBonsai({scene, form, foliage, accent:LIGHT[0].accent, onLabel});
    Object.assign(stats, {first:null, best:null, kept:0, pruned:0, ticker:[]}); hud();
  }
  else if (e.type === 'propose') tree.propose(e.id, e.parent);
  else if (e.type === 'progress') tree.progress(e.id, e.done, e.total);
  else if (e.type === 'practice') tree.shed(e.failed);
  else if (e.type === 'verdict') {
    const v = e.v; tree.verdict(v);
    if (!v.parent) stats.first = stats.best = v.score;
    else if (v.kept) { stats.kept++; stats.best = v.score; stats.ticker.push({text:`${v.id} kept ${Math.round(v.score * 100)}%`}); }
    else { stats.pruned++; stats.ticker.push({text:`${v.id} ${v.signal || 'pruned'}`, cut:true}); }
    hud();
  }
}, {demo:q.get('demo')});

// ---------- run ----------
function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
let last = performance.now(), t = 0;
const tmp = new THREE.Vector3(), dirV = new THREE.Vector3();
renderer.setAnimationLoop(now => {
  const dt = Math.max(0, Math.min(.25, (now - last) / 1000)); last = now; t += dt;
  const wind = 1 + .5 * Math.sin(t * .05) * Math.sin(t * .021);
  tree.update(dt, t, wind);

  // Frame the whole tree as it grows: the camera steps back the way you would from a big tree.
  const b = tree.bounds(), h = b.top - b.bottom, cy = b.bottom + h * .5, tanH = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
  const want = Math.max(11, h * .62 / tanH, b.radius * 1.25 / (tanH * cam.aspect));
  controls.target.y += (cy - controls.target.y) * Math.min(1, dt * .6);
  dirV.copy(cam.position).sub(controls.target); const d = dirV.length();
  cam.position.copy(controls.target).addScaledVector(dirV.normalize(), d + (want - d) * Math.min(1, dt * .5));
  const s = Math.max(8, want * .9);
  Object.assign(sun.shadow.camera, {left:-s * .6, right:s * .6, top:s * .8, bottom:-s * .4, near:.5, far:want * 3}); sun.shadow.camera.updateProjectionMatrix();
  sun.position.set(-.4 * want, .75 * want, .3 * want);
  scene.fog.near = want * .9; scene.fog.far = want * 2.8;
  palT = Math.min(1, palT + dt / 6); scene.fog.color.copy(fogFrom).lerp(fogTo, palT);
  hills.forEach(hs => hs.material.color.copy(scene.fog.color).lerp(HILL, .55));
  sunS.material.color.set(LIGHT[palIdx].accent);

  controls.update();
  renderer.render(scene, cam);

  for (let i = labels.length - 1; i >= 0; i--) {
    const l = labels[i], age = (now - l.born) / 1000;
    if (age > 7) { l.el.remove(); labels.splice(i, 1); continue; }
    tmp.copy(l.pos).project(cam);
    l.el.style.left = (tmp.x * .5 + .5) * innerWidth + 'px'; l.el.style.top = (-tmp.y * .5 + .5) * innerHeight + 'px';
    l.el.style.opacity = tmp.z < 1 ? Math.min(1, age * 2, (7 - age) / 1.5) * .9 : 0;
  }
});
</script>
</body>
</html>
