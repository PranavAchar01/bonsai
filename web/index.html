<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonsai</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#1a1b26; --deep:#16161e; --ink:#c0caf5; --seal:#f7768e; --faint:#565f89; --line:rgba(122,162,247,.18); --moss:#9ece6a; --blue:#7aa2f7; --cyan:#7dcfff; --violet:#bb9af7; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"Chakra Petch",sans-serif; display:flex; flex-direction:column; overflow:hidden; }
  .mono, table, button, select, input, .stat, pre, dl { font-family:"JetBrains Mono",monospace; }
  .ask { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:9px 22px; border-bottom:1px solid var(--line); }
  .ask label { font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); white-space:nowrap; }
  .ask input { flex:1; min-width:120px; background:none; border:0; border-bottom:1px solid var(--line); font-family:"Chakra Petch",sans-serif; font-size:15px; color:var(--ink); padding:3px 2px; outline:none; }
  .ask input::placeholder { color:var(--faint); }
  .ask select { padding:4px 4px; font-size:11px; } .ask select.big { font-family:"Chakra Petch",sans-serif; font-size:16px; padding:4px 6px; border-color:var(--ink); max-width:420px; }
  .rd { font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--faint); white-space:nowrap; } .rd.on { color:var(--moss); }
  .ag .what u { text-decoration:none; color:var(--moss); }
  .ask button { font-size:12px; padding:6px 16px; white-space:nowrap; }
  .ask button.go { color:var(--paper); background:var(--ink); border-color:var(--ink); }
  .ask button.halt { color:var(--seal); border-color:var(--seal); }
  .ask button:disabled { opacity:.35; cursor:default; }
  #phase { font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--faint); padding:6px 22px; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #phase b { color:var(--ink); font-weight:400; } #phase.err b { color:var(--seal); }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--faint); margin-right:8px; }
  .live .dot { background:var(--seal); animation:pulse 1.2s infinite; } @keyframes pulse { 50% { opacity:.25; } }
  #agents-box { flex:0 0 42%; min-height:0; display:flex; flex-direction:column; border-bottom:1px solid var(--line); }
  #agents { overflow-y:auto; flex:1; font-family:"JetBrains Mono",monospace; font-size:11px; }
  .ag { display:grid; grid-template-columns:62px 1fr auto; gap:8px; padding:5px 18px; border-bottom:1px solid rgba(122,162,247,.06); align-items:baseline; }
  .ag .role { color:var(--faint); } .ag .what { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .ag .what i { color:var(--faint); font-style:normal; }
  .ag.working { background:rgba(122,162,247,.06); } .ag.working .st { color:var(--ink); } .ag.queued { color:var(--faint); }
  .ag.passed .st { color:var(--moss); } .ag.failed .st, .ag.cheat .st { color:var(--seal); }
  .empty { padding:10px 18px; color:var(--faint); font-family:"JetBrains Mono",monospace; font-size:11px; line-height:1.7; }
  .logline { display:grid; grid-template-columns:70px 1fr; gap:10px; font-family:"JetBrains Mono",monospace; font-size:12px; line-height:1.7; } .logline span { color:var(--faint); }
  header { display:flex; align-items:baseline; gap:26px; padding:12px 22px; border-bottom:1px solid var(--line); }
  header > * { white-space:nowrap; }
  header h1 { font-weight:600; font-size:24px; letter-spacing:.08em; margin:0; }
  header .tag { color:var(--faint); font-size:13px; }
  .stat { font-size:11px; color:var(--faint); letter-spacing:.06em; }
  .stat b { font-family:"Chakra Petch",sans-serif; font-weight:400; font-size:19px; color:var(--ink); margin-left:5px; }
  .stat.red b { color:var(--seal); }
  .wrap { flex:1; min-height:0; display:grid; grid-template-columns:410px minmax(0,1fr); grid-template-rows:minmax(0,1fr); }
  .panel { min-height:0; min-width:0; display:flex; flex-direction:column; }
  #panel-board { border-right:1px solid var(--line); }
  #panel-graph { border-top:1px solid var(--line); }
  h2 { font-size:11px; font-weight:400; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin:0; padding:12px 18px 8px; display:flex; align-items:center; gap:8px; font-family:"JetBrains Mono",monospace; }
  h2 .sp { flex:1; } h2 .name { color:var(--ink); letter-spacing:.04em; text-transform:none; }
  button { background:none; border:1px solid var(--line); color:var(--faint); font-size:10.5px; padding:3px 8px; cursor:pointer; letter-spacing:.04em; }
  button.on { color:var(--paper); background:var(--ink); border-color:var(--ink); }
  select { background:none; border:1px solid var(--line); font-size:10.5px; color:var(--ink); }
  .tablescroll { overflow-y:auto; flex:1; }
  table { width:100%; border-collapse:collapse; font-size:11.5px; }
  th { text-align:left; font-weight:400; color:var(--faint); font-size:10px; letter-spacing:.1em; padding:5px 8px; position:sticky; top:0; background:var(--paper); border-bottom:1px solid var(--line); }
  td { padding:7px 8px; border-bottom:1px solid rgba(122,162,247,.08); vertical-align:top; }
  td:first-child, th:first-child { padding-left:18px; } .num { text-align:right; padding-right:18px !important; }
  tr { cursor:pointer; } tbody tr:hover { background:rgba(122,162,247,.05); }
  tr.sel { background:rgba(122,162,247,.09); box-shadow:inset 3px 0 0 var(--ink); }
  tr.cut { color:var(--seal); } tr.cut td.chg { text-decoration:line-through; text-decoration-color:rgba(247,118,142,.5); } tr.cut.sel { box-shadow:inset 3px 0 0 var(--seal); }
  td .shed { display:block; color:var(--faint); font-size:10px; margin-top:2px; text-decoration:none; }
  .seg { display:flex; gap:0; padding:0 18px 8px; } .seg button + button { border-left:0; }
  .viewer { position:relative; flex:1; min-height:0; }
  .viewer canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #fx { pointer-events:none; }
  .layer { position:absolute; inset:0; overflow:auto; padding:6px 22px 18px; background:var(--paper); display:none; }
  .layer pre { font-size:12px; line-height:1.6; white-space:pre-wrap; word-break:break-word; margin:0; }
  .layer .add { color:var(--moss); } .layer .del { color:var(--seal); }
  .layer dl { display:grid; grid-template-columns:110px 1fr; gap:8px 14px; font-size:12.5px; max-width:760px; } .layer dt { color:var(--faint); } .layer dd { margin:0; }
  .layer .lede { font-size:22px; margin:6px 0 16px; max-width:760px; line-height:1.4; }
  .stats { display:flex; gap:24px; padding:8px 18px; border-top:1px solid var(--line); font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--faint); flex-wrap:wrap; }
  .stats b { color:var(--ink); font-weight:400; } .stats .cut b { color:var(--seal); }
  #chart { flex:1; min-height:0; width:100%; display:block; }
  .chart-footer { display:flex; justify-content:space-between; padding:2px 18px 8px; font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--faint); }
  @media (max-width:860px){ body{overflow:auto} .wrap{display:block} .viewer{height:70vh} #panel-board{border-right:0} #chart{height:180px} }
  #newset { padding:10px 22px 12px; border-bottom:1px solid var(--line); background:rgba(22,22,30,.72); }
  #newset[hidden] { display:none; }
  #newset .row { display:flex; align-items:center; gap:10px; margin:5px 0; } #newset .row.top { align-items:flex-start; }
  #newset label { width:110px; font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
  #newset input, #newset textarea { flex:1; background:var(--deep); border:1px solid var(--line); color:var(--ink); font-family:"JetBrains Mono",monospace; font-size:12px; padding:6px 8px; outline:none; resize:vertical; }
  #newset input:focus, #newset textarea:focus { border-color:var(--cyan); }
  #newset button { font-size:12px; padding:6px 16px; } #newset button.go { background:var(--violet); border-color:var(--violet); color:var(--deep); font-weight:600; }
  #ns-note { font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--faint); } #ns-note.err { color:var(--seal); }
  .ask select { background:var(--deep); color:var(--ink); border:1px solid var(--line); }
  /* Tokyo Night: neon on indigo. */
  body { background:radial-gradient(ellipse at 70% 0%, rgba(187,154,247,.10), transparent 55%), radial-gradient(ellipse at 0% 100%, rgba(125,207,255,.07), transparent 50%), var(--paper); }
  header h1 { color:var(--cyan); text-shadow:0 0 8px rgba(125,207,255,.55), 0 0 26px rgba(187,154,247,.35); }
  header .tag { color:var(--violet); } #s-note { color:var(--moss); }
  h2 { color:var(--blue); } h2 .name { color:var(--ink); }
  #panel-board { background:rgba(22,22,30,.72); }
  .ask button.go { background:var(--violet); border-color:var(--violet); color:var(--deep); font-weight:600; box-shadow:0 0 14px rgba(187,154,247,.45); }
  .ask button.go:disabled { box-shadow:none; }
  .ask select.big { border-color:var(--blue); background:var(--deep); color:var(--ink); } select option, select optgroup { background:var(--deep); color:var(--ink); }
  button.on { background:var(--blue); border-color:var(--blue); color:var(--deep); }
  .live .dot { background:var(--moss); box-shadow:0 0 8px var(--moss); } #phase b { color:var(--cyan); }
  tr.sel { box-shadow:inset 3px 0 0 var(--cyan); } td.none { color:var(--faint); padding:14px 18px; cursor:default; }
  .ag.working .st { color:var(--cyan); } .layer .lede { color:var(--cyan); }
  #tree3d { position:absolute; inset:0; width:100%; height:100%; border:0; pointer-events:none; }
  ::-webkit-scrollbar { width:8px; } ::-webkit-scrollbar-thumb { background:rgba(122,162,247,.25); }
</style>
</head>
<body>
<header>
  <h1>盆栽 Bonsai</h1><span class="tag">a harness that prunes itself</span>
  <span class="stat" style="margin-left:auto" id="s-note"></span>
</header>
<form class="ask" id="ask" onsubmit="grow(event)">
  <label for="set">Improve it on</label><select id="set" class="big" onchange="fillCount()"></select>
  <button type="button" id="new-btn" onclick="toggleNew()">+ New benchmark</button>
  <span style="flex:1"></span>
  <label for="gens">Generations</label><select id="gens"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
  <label for="count">Problems</label><select id="count"></select>
  <button class="go" id="go" type="submit">Grow</button><button class="halt" id="halt" type="button" onclick="stopRun()" disabled>Stop</button>
</form>
<form id="newset" onsubmit="createSet(event)" hidden>
  <div class="row"><label for="ns-name">Name</label><input id="ns-name" maxlength="60" placeholder="Contract clauses, drug interactions, 10-K questions..."></div>
  <div class="row"><label for="ns-rules">Starting rules</label><input id="ns-rules" maxlength="1000" placeholder="What the agent is told before any change. Leave empty for a plain default."></div>
  <div class="row top"><label for="ns-items">Questions</label><textarea id="ns-items" rows="7" placeholder="One per line, question then answer, separated by =>&#10;Is a signed NDA with no end date enforceable in California? Answer yes or no. => yes&#10;&#10;Or paste JSON lines: {&quot;question&quot;: &quot;...&quot;, &quot;answer&quot;: &quot;...&quot;}"></textarea></div>
  <div class="row"><span id="ns-note">At least 4 questions. Half are held out and never shown to the proposer. Answers match exactly, or within 1% for numbers.</span><span style="flex:1"></span><button type="button" onclick="toggleNew()">Cancel</button><button class="go" id="ns-go" type="submit">Connect</button></div>
</form>
<div id="phase"><span class="dot"></span><b>idle</b> · pick what it should improve on, then Grow</div>
<div class="wrap">
  <div class="panel" id="panel-board">
    <div id="agents-box">
      <h2>Agents <span id="ag-count" class="name"></span><span class="sp"></span>
        <button id="ag-live" class="on" onclick="setAgents('live')">live</button><button id="ag-all" onclick="setAgents('all')">all</button></h2>
      <div id="agents"></div>
    </div>
    <h2>Lineage <span class="sp"></span>
      <button id="sort-latest" class="on" onclick="setSort('latest')">latest</button><button id="sort-score" onclick="setSort('score')">highest score</button></h2>
    <div class="tablescroll"><table>
      <thead><tr><th>version</th><th>change</th><th class="num">held-out</th></tr></thead>
      <tbody id="rows"></tbody></table></div>
  </div>
  <div class="panel" id="panel-solution">
    <h2>Selected version <span id="sel-name" class="name"></span><span class="sp"></span>
      <button id="follow-btn" class="on" onclick="toggleFollow()">following latest</button></h2>
    <div class="seg" id="seg">
      <button data-layer="tree" class="on" onclick="setLayer('tree')">tree</button><button data-layer="diff" onclick="setLayer('diff')">diff</button><button data-layer="signal" onclick="setLayer('signal')">signal</button><button data-layer="harness" onclick="setLayer('harness')">harness</button><button data-layer="activity" onclick="setLayer('activity')">activity</button>
    </div>
    <div class="viewer" id="viewer">
      <iframe id="tree3d" src="tree.html?embed=1&p=tokyo" title="The bonsai"></iframe>
      <div class="layer" id="layer-diff"></div><div class="layer" id="layer-signal"></div><div class="layer" id="layer-harness"></div><div class="layer" id="layer-activity"></div>
    </div>
    <div class="stats" id="sel-stats"></div>
  </div>
</div>
<script>
// The lineage is whatever the loop has stored. Nothing is shown that a run did not produce.
let selected = null, lastJson = '', follow = true, sortBy = 'latest', layer = 'tree';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(data) {
  const kept = [], byParent = {};
  data.versions.forEach(v => (byParent[v.parent] ??= []).push(v));
  for (let v = data.versions.find(v => !v.parent); v; v = (byParent[v.id] || []).find(c => c.kept)) kept.push(v);
  window.__kept = kept; renderUI(data, kept);
}

const pct = x => Math.round(x*100) + '%';
function renderUI(data, kept) {
  const vs = data.versions, best = kept[kept.length-1];
  $('s-note').textContent = vs.length ? `${kept.length - 1} kept · ${vs.length - kept.length} pruned · best ${pct(best.score)} held-out` : 'no run yet';
  if (!vs.length) {
    $('rows').innerHTML = '<tr><td colspan="3" class="none">No versions yet. Press Grow and the first one appears when the seed has been scored.</td></tr>';
    $('sel-name').textContent = ''; $('sel-stats').innerHTML = '';
    ['diff','signal','harness'].forEach(n => $('layer-' + n).innerHTML = '<pre>Nothing has been stored yet.</pre>'); return;
  }
  const order = sortBy === 'score' ? [...vs].sort((a, b) => b.score - a.score) : [...vs].reverse();
  $('rows').innerHTML = order.map(v => `<tr class="${v.kept ? '' : 'cut'} ${v.id === selected ? 'sel' : ''}" data-id="${esc(v.id)}"><td>${esc(v.id)}</td><td class="chg">${esc(v.change)}${v.kept && v.shed && v.shed !== 'nothing' ? `<span class="shed">shed: ${esc(v.shed)}</span>` : ''}</td><td class="num">${pct(v.score)}</td></tr>`).join('');
  const v = vs.find(v => v.id === selected), par = vs.find(p => p.id === v.parent);
  const verdict = !v.parent ? 'seed' : v.kept ? 'kept' : 'pruned';
  $('sel-name').textContent = `${v.id} · ${verdict}`;
  $('layer-diff').innerHTML = v.diff ? `<pre>${esc(v.diff).split('\n').map(l => l.startsWith('+') ? `<span class="add">${l}</span>` : l.startsWith('-') ? `<span class="del">${l}</span>` : l).join('\n')}</pre>` : '<pre>The seed has no parent to differ from.</pre>';
  $('layer-signal').innerHTML = `<div class="lede">${esc(v.signal || 'No signal: this is where the tree starts.')}</div><dl>
    <dt>change tried</dt><dd>${esc(v.change)}</dd><dt>shed</dt><dd>${esc(v.shed || 'n/a')}</dd>
    <dt>verdict</dt><dd>${verdict}${par ? `: held-out ${pct(par.score)} → ${pct(v.score)}` : ''}</dd>
    <dt>Raindrop trace</dt><dd>${esc(v.trace_id || 'none recorded')}</dd></dl>`;
  $('layer-harness').innerHTML = `<pre>${esc(v.harness ? JSON.stringify(v.harness, null, 2) : 'Harness body not recorded for this version.')}</pre>`;
  $('sel-stats').innerHTML = `<span class="${v.kept ? '' : 'cut'}">verdict <b>${verdict}</b></span><span>held-out <b>${par ? pct(par.score) + ' → ' : ''}${pct(v.score)}</b></span><span>parent <b>${esc(par ? par.id : 'none')}</b></span><span>rules <b>${v.tokens ? '~' + v.tokens + ' tokens' : 'n/a'}</b></span><span>shed <b>${esc(v.shed || 'n/a')}</b></span>`;
}
const $ = id => document.getElementById(id);
function select(id, user) { selected = id; if (user) { follow = false; $('follow-btn').classList.remove('on'); $('follow-btn').textContent = 'follow latest'; } draw(window.__d); }
function toggleFollow() { follow = !follow; $('follow-btn').classList.toggle('on', follow); $('follow-btn').textContent = follow ? 'following latest' : 'follow latest'; if (follow) { selected = window.__d.versions.at(-1)?.id; draw(window.__d); } }
function setSort(k) { sortBy = k; $('sort-latest').classList.toggle('on', k === 'latest'); $('sort-score').classList.toggle('on', k === 'score'); renderUI(window.__d, window.__kept); }
function setLayer(l) { layer = l; document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.layer === l)); ['diff','signal','harness','activity'].forEach(n => $('layer-' + n).style.display = n === l ? 'block' : 'none'); }

async function load() {
  let data = {versions:[]};
  try { const r = await fetch('lineage.json', {cache:'no-store'}); if (r.ok) data = await r.json(); } catch {}
  const j = JSON.stringify(data); if (j === lastJson) return; lastJson = j;
  window.__d = data; if (follow || !data.versions.some(v => v.id === selected)) selected = data.versions.at(-1)?.id;
  draw(data);
}
$('rows').addEventListener('click', e => { const r = e.target.closest('tr'); if (r) select(r.dataset.id, true); });

// The run: what was asked, every agent working on it, and the log. Polled from the local server.
let agentView = 'live', app = null, growErr = null, setsSig = '', wantSet = null;
// How many problems to use: all of them, or a smaller even number for a quicker run.
function fillCount() {
  const n = (app?.sets.find(x => x.key === $('set').value) || {}).count || 0;
  const opts = [...new Set([4, 8, 12, 20, 40, n].filter(k => k >= 4 && k <= n))].sort((x, y) => x - y);
  $('count').innerHTML = opts.map(k => `<option value="${k}" ${k === n ? 'selected' : ''}>${k === n ? 'all ' + k : k}</option>`).join('');
}
function toggleNew() { const f = $('newset'); f.hidden = !f.hidden; $('new-btn').classList.toggle('on', !f.hidden); if (!f.hidden) $('ns-name').focus(); }
function parseItems(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    if (l.startsWith('{')) { try { const o = JSON.parse(l); return {q: o.question ?? o.q, a: String(o.answer ?? o.a ?? '')}; } catch { return null; } }
    const i = l.lastIndexOf('=>'); return i < 0 ? null : {q: l.slice(0, i).trim(), a: l.slice(i + 2).trim()};
  });
}
async function createSet(e) {
  e.preventDefault(); const note = $('ns-note'), items = parseItems($('ns-items').value), bad = items.findIndex(x => !x || !x.q || !x.a);
  const fail = t => { note.className = 'err'; note.textContent = t; };
  if (!$('ns-name').value.trim()) return fail('Give it a name.');
  if (bad >= 0) return fail(`Line ${bad + 1} has no "=>" answer, or is not valid JSON.`);
  if (items.length < 4) return fail('It needs at least 4 questions.');
  $('ns-go').disabled = true;
  const r = await fetch('api/sets', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:$('ns-name').value, rules:$('ns-rules').value, items})});
  const j = await r.json().catch(() => ({})); $('ns-go').disabled = false;
  if (!r.ok) return fail(j.error || 'could not create it');
  note.className = ''; note.textContent = `Connected with ${j.count} questions. It is selected: press Grow.`;
  wantSet = j.key; $('ns-items').value = ''; $('ns-name').value = ''; await poll(); toggleNew();
}
const secs = s => s < 60 ? Math.round(s) + 's' : Math.floor(s/60) + 'm' + String(Math.round(s%60)).padStart(2, '0');
function setAgents(v) { agentView = v; $('ag-live').classList.toggle('on', v === 'live'); $('ag-all').classList.toggle('on', v === 'all'); renderRun(); }
function renderRun() {
  const a = app; if (!a) return;
  const job = a.job, running = job && job.status === 'running';
  const sig = JSON.stringify(a.sets.map(x => [x.key, x.ready, x.count]));
  if (sig !== setsSig) { setsSig = sig; const keep = wantSet || $('set').value; wantSet = null; const groups = [...new Set(a.sets.map(x => x.group))];
    $('set').innerHTML = groups.map(g => `<optgroup label="${esc(g)}">${a.sets.filter(x => x.group === g).map(x => `<option value="${esc(x.key)}" ${x.ready ? '' : 'disabled'}>${esc(x.name)}${x.count ? ` · ${x.count} problems` : ''}${x.ready ? '' : ` · ${esc(x.why)}`}</option>`).join('')}</optgroup>`).join('');
    if (keep && a.sets.some(x => x.key === keep && x.ready)) $('set').value = keep; fillCount(); }
  $('go').disabled = running; $('halt').disabled = !running; $('go').textContent = running ? 'Growing…' : 'Grow'; if (!running) stopping = false; $('halt').textContent = stopping ? 'Stopping…' : 'Stop';
  const ph = $('phase'); ph.className = running ? 'live' : job && job.status === 'error' ? 'err' : '';
  ph.innerHTML = '<span class="dot"></span>' + (!job ? '<b>idle</b> · pick what it should improve on, then Grow'
    : running ? `<b>${esc(job.phase)}</b> · ${esc(job.set)}${job.goal ? ' · steer: ' + esc(job.goal) : ''} · ${secs(a.now - job.started)}`
    : job.status === 'error' ? `<b>run failed</b> · ${esc(job.error)}`
    : `<b>${esc(job.status)}</b> · ${esc(job.set)}${job.goal ? ' · steer: ' + esc(job.goal) : ''} · took ${secs(job.ended - job.started)}`);
  // A refused Grow stays on screen long enough to read, instead of being wiped by the next poll.
  if (growErr && Date.now() < growErr.until) { ph.className = 'err'; ph.innerHTML = `<span class="dot"></span><b>${esc(growErr.text)}</b>`; }
  const all = a.agents, live = all.filter(x => x.status === 'working' || x.status === 'queued');
  const done = all.filter(x => x.ended).sort((x, y) => y.ended - x.ended);
  const show = agentView === 'live' ? [...live.filter(x => x.status === 'working'), ...live.filter(x => x.status === 'queued'), ...done.slice(0, 6)] : [...all].reverse();
  $('ag-count').textContent = all.length ? `${live.filter(x => x.status === 'working').length} working · ${live.filter(x => x.status === 'queued').length} queued · ${done.length} done` : '';
  $('agents').innerHTML = show.length ? show.map(x => {
    const st = x.status === 'working' ? 'working ' + secs(a.now - x.started) : x.status === 'queued' ? 'queued' : x.status === 'cheat' ? 'edited tests' : x.status + (x.turns ? ` · ${x.turns} turns` : '');
    return `<div class="ag ${esc(x.status)}" title="${esc((x.trace ? 'Raindrop trace ' + x.trace + '. ' : '') + (x.said || ''))}"><span class="role">${esc(x.role)}</span><span class="what">${esc(x.task)} <i>${esc(x.version)} · ${esc(x.split)} · ${esc(x.model)}</i>${x.trace ? ' <u>◆</u>' : ''}</span><span class="st">${esc(st)}</span></div>`;
  }).join('') : `<div class="empty">No agents yet. A run starts solver agents (one per problem, on the model being improved) and a proposer agent that reads their failures and rewrites the harness.</div>`;
  $('layer-activity').innerHTML = a.log.length ? [...a.log].reverse().map(l => `<div class="logline"><span>${new Date(l.ts*1000).toLocaleTimeString()}</span><div>${esc(l.text)}</div></div>`).join('') : '<pre>Nothing has run in this session yet.</pre>';
}
async function poll() {
  try { const r = await fetch('api/state', {cache:'no-store'}); if (!r.ok) throw 0; app = await r.json(); renderRun(); }
  catch { $('phase').innerHTML = '<span class="dot"></span><b>view only</b> · start the app with python server.py to run it from here'; $('go').disabled = true; }
}
async function post(path, body) {
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json().catch(() => ({})); growErr = r.ok ? null : {text: j.error || 'request failed', until: Date.now() + 8000}; return r.ok;
}
async function grow(e) {
  e.preventDefault(); $('go').disabled = true; $('go').textContent = 'Starting…';
  const ok = await post('api/grow', {set:$('set').value, generations:+$('gens').value, count:+$('count').value});
  if (ok) { lastJson = ''; setLayer('tree'); follow = true; $('follow-btn').classList.add('on'); $('follow-btn').textContent = 'following latest'; }
  poll(); load();
}
let stopping = false;
async function stopRun() { stopping = true; await post('api/stop', {}); poll(); }
load(); poll(); setInterval(load, 3000); setInterval(poll, 1000);
</script>
</body>
