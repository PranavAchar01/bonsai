<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonsai</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --paper:#efe7d6; --ink:#1d1b19; --wash:#6f7f6a; --seal:#b5332a; --faint:#8b8272; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"Shippori Mincho",serif; }
  .scroll { display:grid; grid-template-columns:minmax(0,1fr) 380px; min-height:100vh; }
  canvas { width:100%; height:100vh; display:block; }
  aside { padding:36px 26px; border-left:1px solid rgba(29,27,25,.18); height:100vh; overflow-y:auto; }
  h1 { font-weight:600; font-size:34px; letter-spacing:.08em; margin:0 0 2px; }
  .sub { color:var(--faint); font-size:14px; margin-bottom:28px; }
  .big { font-size:54px; line-height:1; }
  .big small { font-size:16px; color:var(--faint); }
  .row { display:flex; gap:10px; cursor:pointer; justify-content:space-between; font-family:"IBM Plex Mono",monospace; font-size:12px; padding:7px 0; border-bottom:1px solid rgba(29,27,25,.12); }
  .row.cut { color:var(--seal); text-decoration:line-through; text-decoration-color:rgba(181,51,42,.5); }
  .row span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row:hover { background:rgba(29,27,25,.05); }
  .row.sel { background:rgba(29,27,25,.09); box-shadow:inset 2px 0 0 var(--ink); padding-left:8px; }
  .row.cut.sel { box-shadow:inset 2px 0 0 var(--seal); }
  .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:18px; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--faint); }
  .stats b { display:block; font-family:"Shippori Mincho",serif; font-size:24px; font-weight:400; color:var(--ink); }
  .stats .red b { color:var(--seal); }
  #detail { font-size:14px; line-height:1.55; }
  #detail .verdict { font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em; }
  #detail .verdict.cut { color:var(--seal); }
  #detail dl { display:grid; grid-template-columns:74px 1fr; gap:4px 10px; margin:10px 0; font-family:"IBM Plex Mono",monospace; font-size:11.5px; }
  #detail dt { color:var(--faint); } #detail dd { margin:0; word-break:break-word; }
  #detail pre { font-family:"IBM Plex Mono",monospace; font-size:10.5px; line-height:1.5; background:rgba(29,27,25,.05); padding:10px; margin:8px 0 0; white-space:pre-wrap; word-break:break-word; max-height:260px; overflow:auto; }
  #detail .add { color:#2f5a3a; } #detail .del { color:var(--seal); }
  .label { font-size:12px; letter-spacing:.14em; color:var(--faint); margin:26px 0 6px; text-transform:uppercase; }
  .note { font-size:13px; color:var(--faint); margin-top:18px; line-height:1.6; }
  @media (max-width:820px){ .scroll{grid-template-columns:1fr} canvas{height:70vh} aside{border-left:0} }
</style>
</head>
<body>
<div class="scroll">
  <canvas id="c"></canvas>
  <aside>
    <h1>盆栽 Bonsai</h1>
    <div class="sub">a harness that prunes itself</div>
    <div class="label">held-out pass rate</div>
    <div class="big"><span id="score"></span><small id="from"></small></div>
    <div class="stats">
      <div><b id="nKept"></b>kept</div><div class="red"><b id="nCut"></b>pruned</div><div class="red"><b id="nCheat"></b>cheats caught</div>
    </div>
    <div class="label">harness versions</div>
    <div id="rows"></div>
    <div class="label">selected version</div>
    <div id="detail"></div>
    <div class="note" id="note"></div>
  </aside>
</div>
<script>
// Sample lineage. Replaced by the Mongo `versions` collection once the loop runs.
const SAMPLE = { sample:true, versions:[
  {id:"g0", parent:null, kept:true,  score:.40, change:"seed harness"},
  {id:"g1a",parent:"g0", kept:false, score:.37, change:"add planning step", signal:"no gain"},
  {id:"g1b",parent:"g0", kept:true,  score:.47, change:"run tests before finishing", signal:"claimed pass, never ran"},
  {id:"g2a",parent:"g1b",kept:false, score:.63, change:"edit the test file", signal:"cheat caught"},
  {id:"g2b",parent:"g1b",kept:true,  score:.53, change:"re-read spec on failure", signal:"same edit repeated"},
  {id:"g3a",parent:"g2b",kept:true,  score:.57, change:"drop unused Write tool", signal:"prune"},
  {id:"g3b",parent:"g2b",kept:false, score:.50, change:"longer rules", signal:"tokens up, score down"},
  {id:"g4a",parent:"g3a",kept:true,  score:.63, change:"edge-case checklist", signal:"gave up early"},
]};

let hits = [], selected = null, lastJson = '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INK = [29,27,25], SEAL = [181,51,42];
const rgba = (c,a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// One brush stroke: stamps along a quadratic curve, pressure tapers, dry-brush gaps near the tip.
function stroke(p0, p1, p2, w0, w1, col = INK, alpha = .82) {
  const steps = Math.hypot(p2[0]-p0[0], p2[1]-p0[1]) * 1.4;
  for (let i = 0; i <= steps; i++) {
    const t = i/steps, u = 1-t;
    const x = u*u*p0[0] + 2*u*t*p1[0] + t*t*p2[0], y = u*u*p0[1] + 2*u*t*p1[1] + t*t*p2[1];
    const w = (w0 + (w1-w0)*t) * (.86 + rnd()*.28);
    if (t > .55 && rnd() < (t-.55)*.5) continue;
    ctx.fillStyle = rgba(col, alpha * (.55 + rnd()*.45));
    ctx.beginPath(); ctx.ellipse(x + (rnd()-.5)*w*.3, y + (rnd()-.5)*w*.3, w/2, w/2*(.7+rnd()*.3), rnd()*3, 0, 7); ctx.fill();
  }
}
// Watercolor pad: many thin pigment pools that bleed past each other, darker at the edges.
function wash(x, y, r, col, layers = 26) {
  for (let i = 0; i < layers; i++) {
    const a = rnd()*6.28, d = rnd()*r*.55, rr = r*(.35 + rnd()*.55);
    const cx = x + Math.cos(a)*d*1.5, cy = y + Math.sin(a)*d*.55;
    const g = ctx.createRadialGradient(cx, cy, rr*.2, cx, cy, rr);
    g.addColorStop(0, rgba(col, .035)); g.addColorStop(.82, rgba(col, .075)); g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cx, cy, rr*1.25, rr*.62, (rnd()-.5)*.5, 0, 7); ctx.fill();
  }
}
function pad(x, y, r) {
  wash(x, y - r*.18, r*.95, [86,118,84], 9);
  const tones = [[34,58,44],[46,78,56],[62,98,66],[88,124,82],[120,150,98]];
  const count = Math.round(r*9);
  for (let i = 0; i < count; i++) {
    // dome: wide ellipse, clipped flat at the bottom, lumpy along the top
    const a = Math.PI + rnd()*Math.PI, d = Math.sqrt(rnd());
    const lump = 1 + .16*Math.sin(a*5 + x*.01);
    const px = x + Math.cos(a)*d*r*1.15*lump, py = y + Math.sin(a)*d*r*.5*lump + (rnd()-.5)*4;
    const depth = 1 - (y - py)/(r*.5);                       // 1 at the underside, 0 at the top
    const tone = tones[Math.min(4, Math.max(0, Math.floor((1-depth)*4 + (rnd()-.5)*1.8)))];
    const len = 3.5 + rnd()*5.5, ang = -Math.PI/2 + (px - x)/(r*1.15)*.9 + (rnd()-.5)*.7;
    ctx.strokeStyle = rgba(tone, .42 + rnd()*.4); ctx.lineWidth = .9 + rnd()*1.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(ang)*len, py + Math.sin(ang)*len); ctx.stroke();
  }
  for (let i = 0; i < r*.5; i++) {                           // ink shadow under the pad
    const px = x + (rnd()-.5)*r*1.9, py = y + rnd()*5;
    ctx.fillStyle = rgba([24,34,28], .28 + rnd()*.3); ctx.beginPath(); ctx.ellipse(px, py, 2 + rnd()*5, 1 + rnd()*1.6, 0, 0, 7); ctx.fill();
  }
}
function paper(W, H) {
  ctx.fillStyle = '#efe7d6'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 2600; i++) { ctx.fillStyle = rgba([120,105,80], rnd()*.05); ctx.fillRect(rnd()*W, rnd()*H, 1 + rnd()*14, .6); }
  wash(W*.72, H*.2, H*.16, [181,51,42], 14);                 // pale sun
  for (let i = 0; i < 3; i++) wash(W*(.15 + i*.3), H*(.78 - i*.03), H*.22, [96,110,130], 12);   // far hills
}

function draw(data) {
  seed = 7;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  paper(W, H);
  const kept = [], byParent = {};
  data.versions.forEach(v => (byParent[v.parent] ??= []).push(v));
  for (let v = data.versions.find(v => !v.parent); v; v = (byParent[v.id] || []).find(c => c.kept)) kept.push(v);
  const baseX = W*.46, baseY = H*.8, top = H*.2, n = kept.length;
  // Trunk nodes climb in an S (moyogi form).
  const node = i => { const t = i/Math.max(n-1, 1); return [baseX + Math.sin(t*4.2)*W*.09 - t*W*.03, baseY - t*(baseY-top)]; };
  // pot and ground
  stroke([baseX-W*.19, baseY+34], [baseX, baseY+44], [baseX+W*.19, baseY+34], 3, 2, INK, .5);
  ctx.fillStyle = rgba(INK, .78); ctx.beginPath();
  ctx.moveTo(baseX-110, baseY+6); ctx.lineTo(baseX+110, baseY+6); ctx.lineTo(baseX+88, baseY+38); ctx.lineTo(baseX-88, baseY+38); ctx.fill();
  wash(baseX, baseY+4, 70, [70,84,60], 10);
  const labels = []; hits = [];
  for (let i = 0; i < n; i++) {
    const p = node(i), q = i+1 < n ? node(i+1) : null, w = 30*(1 - i/n*.78);
    if (q) stroke(p, [(p[0]+q[0])/2 + (i%2 ? 16 : -16), (p[1]+q[1])/2], q, w, w*.8);
    const side = i % 2 ? 1 : -1;
    (byParent[kept[i].id] || []).forEach((c, k) => {
      const dir = c.kept ? side : -side, len = c.kept ? W*(.13 + c.score*.1) : W*.07;
      const tip = [p[0] + dir*len, p[1] - 26 - k*8 - (c.kept ? 22 : 0)];
      const from = c.kept && q ? q : p;
      const end = c.kept ? [from[0] + dir*len, from[1] - 6] : tip;
      stroke(from, [from[0] + dir*len*.4, from[1] + 10], end, w*.42, c.kept ? 3 : 5);
      if (c.kept) {
        const pr = 40 + c.score*64;
        pad(end[0] - dir*pr*.25, end[1] - 2, pr); pad(end[0] + dir*pr*.55, end[1] - pr*.34, pr*.6);
        hits.push([end[0], end[1] - pr*.2, pr*1.3, c.id]);
        labels.push([end[0], end[1] + 26, `${c.id}  ${Math.round(c.score*100)}%`, INK]);
      } else {
        stroke([end[0]-9, end[1]-12], [end[0], end[1]], [end[0]+9, end[1]+12], 4, 2, SEAL, .9);
        hits.push([end[0], end[1], 26, c.id]);
        labels.push([end[0] + dir*14, end[1] - 14, c.signal, SEAL, dir]);
      }
    });
  }
  const crown = node(n-1); pad(crown[0], crown[1] + 4, 84); pad(crown[0] - 40, crown[1] - 30, 54); pad(crown[0] + 48, crown[1] - 22, 46);
  hits.push([baseX, baseY, 60, kept[0].id]);
  ctx.font = '12px "IBM Plex Mono", monospace';
  labels.forEach(([x, y, s, c, dir]) => { ctx.fillStyle = rgba(c, .85); ctx.textAlign = dir ? (dir > 0 ? 'left' : 'right') : 'center'; ctx.fillText(s, x, y); });
  // seal
  ctx.fillStyle = rgba(SEAL, .88); ctx.fillRect(W - 78, H - 92, 44, 44);
  ctx.fillStyle = '#efe7d6'; ctx.font = '600 26px "Shippori Mincho", serif'; ctx.textAlign = 'center'; ctx.fillText('盆', W - 56, H - 60);

  const first = kept[0].score, last = kept[n-1].score;
  score.textContent = Math.round(last*100) + '%'; from.textContent = `  from ${Math.round(first*100)}%`;
  nKept.textContent = data.versions.filter(v => v.kept).length - 1;
  nCut.textContent = data.versions.filter(v => !v.kept).length;
  nCheat.textContent = data.versions.filter(v => v.signal === 'cheat caught').length;
  if (!selected || !data.versions.some(v => v.id === selected)) selected = kept[n-1].id;
  rows.innerHTML = data.versions.map(v => `<div class="row ${v.kept ? '' : 'cut'} ${v.id === selected ? 'sel' : ''}" data-id="${esc(v.id)}"><span>${esc(v.id)} ${esc(v.change)}</span><span>${Math.round(v.score*100)}</span></div>`).join('');
  const v = data.versions.find(v => v.id === selected), par = data.versions.find(p => p.id === v.parent);
  const diff = esc(v.diff || '').split('\n').map(l => l.startsWith('+') ? `<span class="add">${l}</span>` : l.startsWith('-') ? `<span class="del">${l}</span>` : l).join('\n');
  detail.innerHTML = `<div class="verdict ${v.kept ? '' : 'cut'}">${esc(v.id)} · ${!v.parent ? 'SEED' : v.kept ? 'KEPT' : 'PRUNED'}</div>
    <div>${esc(v.change)}</div>
    <dl><dt>score</dt><dd>${par ? Math.round(par.score*100) + '% → ' : ''}${Math.round(v.score*100)}% held-out</dd>
    ${v.signal ? `<dt>signal</dt><dd>${esc(v.signal)}</dd>` : ''}
    ${par ? `<dt>parent</dt><dd>${esc(par.id)}</dd>` : ''}
    ${v.tokens ? `<dt>size</dt><dd>~${v.tokens} tokens of rules</dd>` : ''}
    ${v.trace_id ? `<dt>trace</dt><dd>${esc(v.trace_id)}</dd>` : ''}</dl>
    ${diff ? `<pre>${diff}</pre>` : ''}`;
  note.textContent = data.sample ? 'Sample lineage for layout. No run has produced these numbers.' : '';
}

async function load() {
  let data = SAMPLE;
  try { const r = await fetch('lineage.json', {cache:'no-store'}); if (r.ok) data = await r.json(); } catch {}
  const j = JSON.stringify(data); if (j === lastJson) return; lastJson = j;
  window.__d = data; await document.fonts.ready; draw(data);
}
rows.addEventListener('click', e => { const r = e.target.closest('.row'); if (r) { selected = r.dataset.id; draw(window.__d); } });
cv.addEventListener('click', e => {
  const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
  const h = hits.filter(h => Math.hypot(h[0]-x, h[1]-y) < h[2]).sort((a, b) => a[2] - b[2])[0];
  if (h) { selected = h[3]; draw(window.__d); }
});
load(); addEventListener('resize', () => draw(window.__d || SAMPLE)); setInterval(load, 5000);
</script>
</body>
</html>
