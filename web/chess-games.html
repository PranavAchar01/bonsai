<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Bonsai chess games</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --paper:#efe7d6; --ink:#1d1b19; --faint:#8b8272; --seal:#b5332a; --line:rgba(29,27,25,.16); }
  * { box-sizing:border-box; } html, body { height:100%; }
  body { margin:0; background:var(--paper); color:var(--ink); font:11.5px/1.5 "IBM Plex Mono", monospace; display:flex; flex-direction:column; align-items:center; overflow:hidden; }
  #games { display:flex; flex-wrap:wrap; justify-content:center; gap:4px 6px; padding:14px 20px 0; max-width:900px; }
  #games button { font:12px "DotGothic16", monospace; background:none; border:1px solid var(--line); color:var(--faint); padding:1px 9px; cursor:pointer; }
  #games button.on { color:var(--ink); border-color:var(--ink); }
  #note { color:var(--faint); font-size:10.5px; min-height:16px; margin-top:6px; }
  #stage { flex:1; width:100%; display:grid; place-items:center; min-height:0; }
  iframe { width:620px; height:380px; border:0; transform-origin:center; }
</style></head><body>
<!-- The saved chess games in the same board-and-move-table view the live run uses (views/chess.html). -->
<nav id="games"></nav>
<div id="note"></div>
<div id="stage"><iframe id="view" src="views/chess.html" title="Chess game"></iframe></div>
<script>
const $ = id => document.getElementById(id), q = new URLSearchParams(location.search), version = q.get('ver') || 'g0';
const GAMES = ['caro-kann', 'english', 'french', 'italian', 'kings-indian', 'london', 'queens-gambit', 'ruy-lopez', 'scandinavian', 'sicilian'].flatMap(o => [`${o}-white`, `${o}-black`]);
let game = q.get('game') || GAMES[0], seq = 0;
function fit() { const s = $('stage'), k = Math.max(.6, Math.min((s.clientWidth - 40) / 620, (s.clientHeight - 30) / 380, 2.2)); $('view').style.transform = `scale(${k})`; }
addEventListener('resize', fit);
function tabs() { $('games').innerHTML = GAMES.map(g => `<button type="button" class="${g === game ? 'on' : ''}" onclick="pick('${g}')">${g.replace(/-(white|black)$/, ' · $1')}</button>`).join(''); }
async function pick(g) {
  game = g; tabs(); const mine = ++seq, task = `chess/game-${g}`;
  const j = await fetch(`api/watch?version=${encodeURIComponent(version)}&task=${encodeURIComponent(task)}`, {cache:'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null);
  if (mine !== seq) return;
  const lines = j?.lines || [];
  $('note').textContent = lines.length ? `${version} · Haiku against Stockfish` : `no saved game for ${g} at ${version}`;
  $('view').contentWindow.postMessage({lines, question: j?.question || '', agent: {task, version, status: 'completed', model: 'haiku', split: 'heldout'}, set: {key: 'chess', name: 'Chess'}, colors: {}}, '*');
}
$('view').addEventListener('load', () => { fit(); pick(game); });
tabs();
</script></body></html>
